name: BIST Radar Günlük Güncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gereksinimleri kur
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: BIST verilerini güncelle
        run: python update_data.py

      - name: data.json dosyasını geçerli JSON'a çevir
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("data.json")

          if not path.exists():
              raise SystemExit("HATA: data.json oluşturulmadı.")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          def temizle(v):
              if isinstance(v, float):
                  return v if math.isfinite(v) else None
              if isinstance(v, list):
                  return [temizle(x) for x in v]
              if isinstance(v, dict):
                  return {k: temizle(x) for k, x in v.items()}
              return v

          data = temizle(data)

          if not isinstance(data, list):
              raise SystemExit("HATA: data.json liste formatında değil.")

          if len(data) < 400:
              raise SystemExit(
                  f"HATA: Beklenenden az hisse bulundu: {len(data)}"
              )

          path.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  allow_nan=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          print(f"data.json hazır: {len(data)} hisse")
          PY

      - name: JSON son kontrol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit("HATA: JSON liste değil.")

          if len(data) < 400:
              raise SystemExit(
                  f"HATA: JSON'da çok az hisse var: {len(data)}"
              )

          print(f"JSON geçerli. Toplam hisse: {len(data)}")
          PY

      - name: Değişiklikleri GitHub'a gönder
        run: |
          git config user.name "BIST Radar Bot"
          git config user.email "bist-radar-bot@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Yeni veri değişikliği yok."
            exit 0
          fi

          git commit -m "BIST verilerini güncelle"
          git push origin HEAD:ana
