<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BIST Radar</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b1220;
    color:#e5e7eb
}

header{
    background:#111827;
    border-bottom:1px solid #263244;
    padding:20px
}

.header{
    max-width:1400px;
    margin:auto
}

h1{
    margin:0 0 6px;
    font-size:28px
}

.sub{
    color:#94a3b8;
    font-size:14px
}

.container{
    max-width:1400px;
    margin:auto;
    padding:18px
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:16px
}

.card{
    background:#111827;
    border:1px solid #263244;
    border-radius:14px;
    padding:18px
}

.card small{
    color:#94a3b8
}

.card strong{
    display:block;
    font-size:28px;
    margin-top:7px
}

.controls{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:10px;
    margin-bottom:15px
}

input,select{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #334155;
    background:#111827;
    color:white
}

.tablebox{
    overflow:auto;
    background:#111827;
    border:1px solid #263244;
    border-radius:14px
}

table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse
}

th{
    background:#172033;
    color:#94a3b8;
    padding:13px 10px;
    text-align:left;
    font-size:12px
}

td{
    padding:12px 10px;
    border-top:1px solid #202b3d;
    font-size:13px
}

tr:hover{
    background:#172033;
    cursor:pointer
}

.code{
    font-weight:bold;
    font-size:15px
}

.name{
    color:#64748b;
    font-size:11px;
    margin-top:3px
}

.score{
    display:inline-block;
    min-width:42px;
    text-align:center;
    padding:5px 8px;
    border-radius:7px;
    font-weight:bold
}

.vgood{background:#064e3b;color:#6ee7b7}
.good{background:#14532d;color:#86efac}
.pos{background:#365314;color:#bef264}
.neutral{background:#374151;color:#d1d5db}
.weak{background:#78350f;color:#fdba74}
.bad{background:#7f1d1d;color:#fca5a5}

.signal{
    padding:5px 8px;
    border-radius:7px;
    font-size:11px;
    font-weight:bold
}

#status{
    color:#94a3b8;
    margin:12px 0
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:99;
    padding:20px;
    align-items:center;
    justify-content:center
}

.modalbox{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:#111827;
    border:1px solid #334155;
    border-radius:18px;
    padding:25px;
    position:relative
}

.close{
    position:absolute;
    right:15px;
    top:10px;
    background:none;
    border:0;
    color:#aaa;
    font-size:30px
}

.detail{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:20px
}

.detail div{
    background:#172033;
    padding:12px;
    border-radius:10px
}

.detail small{
    display:block;
    color:#94a3b8;
    margin-bottom:5px
}

@media(max-width:700px){
    .cards{grid-template-columns:repeat(2,1fr)}
    .controls{grid-template-columns:1fr}
    .detail{grid-template-columns:repeat(2,1fr)}
    h1{font-size:23px}
}
</style>
</head>

<body>

<header>
<div class="header">
<h1>📡 BIST Radar</h1>
<div class="sub">
BIST hisseleri • Teknik analiz • Momentum • Para akışı • Risk
</div>
</div>
</header>

<div class="container">

<div class="cards">

<div class="card">
<small>Toplam Hisse</small>
<strong id="total">-</strong>
</div>

<div class="card">
<small>Güçlü Hisse</small>
<strong id="strong">-</strong>
</div>

<div class="card">
<small>Pozitif Hisse</small>
<strong id="positive">-</strong>
</div>

<div class="card">
<small>Ortalama Skor</small>
<strong id="average">-</strong>
</div>

</div>

<div class="controls">

<input
id="search"
placeholder="🔎 Hisse veya şirket ara..."
>

<select id="filter">
<option value="all">Tüm hisseler</option>
<option value="very">Çok Güçlü</option>
<option value="strong">Güçlü</option>
<option value="positive">Pozitif</option>
<option value="neutral">Nötr</option>
<option value="weak">Zayıf</option>
</select>

<select id="sort">
<option value="score">Genel Skor</option>
<option value="technical">Teknik</option>
<option value="flow">Para Akışı</option>
<option value="riskScore">Risk</option>
<option value="ret21">21 Gün Getiri</option>
<option value="volumeRatio">Hacim</option>
<option value="rsi">RSI</option>
</select>

</div>

<div id="status">Veriler yükleniyor...</div>

<div class="tablebox">

<table>

<thead>
<tr>
<th>#</th>
<th>HİSSE</th>
<th>FİYAT</th>
<th>SKOR</th>
<th>TEKNİK</th>
<th>AKIŞ</th>
<th>RİSK</th>
<th>21G</th>
<th>HACİM</th>
<th>SİNYAL</th>
</tr>
</thead>

<tbody id="table">
</tbody>

</table>

</div>

</div>

<div id="modal" class="modal">

<div class="modalbox">

<button class="close" onclick="closeModal()">×</button>

<h2 id="modalCode"></h2>
<div id="modalName" class="sub"></div>

<div id="modalScore"></div>

<div id="modalSignal"></div>

<div id="details" class="detail"></div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
