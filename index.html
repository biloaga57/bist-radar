<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIST Radar</title><style>:root{--bg:#061221;--card:#0b1b2d;--line:#1b3045;--text:#e8f0f8;--muted:#8ea3b8;--blue:#38a8ff;--green:#25c78a;--yellow:#f0c95b;--red:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#071524ee;z-index:5}.wrap{max-width:1450px;margin:auto;padding:16px}h1{margin:0}.sub,.muted{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}.stat{padding:13px}.stat b{display:block;font-size:22px;margin-top:5px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}input,select{background:#081827;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px}input{flex:1;min-width:220px}.panel{overflow:hidden}.title{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:bold}.table-wrap{overflow:auto;max-height:76vh}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 8px;border-bottom:1px solid #14283a;white-space:nowrap}th{position:sticky;top:0;background:#0c1d2f;color:#91a9bf;text-align:left}td.num,th.num{text-align:right}tr:hover{background:#0e2438}.badge{padding:4px 7px;border-radius:12px;font-size:10px;font-weight:bold}.strong{color:var(--green)}.watch{color:var(--yellow)}.weak{color:var(--red)}.neutral{color:#b9c6d3}.badge.strong{background:#0b3a2d}.badge.watch{background:#3b3214}.badge.weak{background:#3b1720}.badge.neutral{background:#263545}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}}</style></head><body><header><div class="wrap" style="padding:0"><h1>🇹🇷 BIST Radar</h1><div class="sub">Tüm BIST hisseleri • Günlük tarama</div></div></header><main class="wrap"><div class="stats"><div class="stat"><span class="muted">TOPLAM HİSSE</span><b id="total">0</b></div><div class="stat"><span class="muted">GÜÇLÜ</span><b id="strong">0</b></div><div class="stat"><span class="muted">İZLE</span><b id="watch">0</b></div><div class="stat"><span class="muted">ORTALAMA SKOR</span><b id="avg">-</b></div></div><div class="controls"><input id="q" placeholder="Hisse kodu veya şirket ara..."><select id="sig"><option value="">Tüm sinyaller</option><option>GÜÇLÜ</option><option>İZLE</option><option>NÖTR</option><option>ZAYIF</option></select><select id="sort"><option value="score">Genel skor</option><option value="code">Kod</option><option value="price">Fiyat</option><option value="technical">Teknik</option><option value="flow">Akış</option></select></div><section class="panel"><div class="title">📊 TÜM BIST TARAMASI — <span id="shown">0</span> hisse</div><div class="table-wrap"><table><thead><tr><th>KOD</th><th>ŞİRKET</th><th class="num">FİYAT</th><th class="num">TEKNİK</th><th class="num">TEMEL</th><th class="num">DEĞERLEME</th><th class="num">AKIŞ</th><th>RİSK</th><th class="num">GENEL</th><th>SİNYAL</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>let A=[];const $=id=>document.getElementById(id);function get(o,ks,d=null){for(const k of ks)if(o&&o[k]!=null&&o[k]!=='')return o[k];return d}function n(x,d=50){x=Number(x);return Number.isFinite(x)?x:d}function sig(s){return s>=75?'GÜÇLÜ':s>=60?'İZLE':s>=45?'NÖTR':'ZAYIF'}function norm(o){let t=n(get(o,['teknik','technical','technical_score'])),f=n(get(o,['temel','fundamental','fundamental_score'])),v=n(get(o,['değerleme','degerleme','valuation','valuation_score'])),a=n(get(o,['akış','akis','flow','money_flow','flow_score'])),r=get(o,['risk','risk_level'],'Orta'),s=Number(get(o,['genel','score','overall','general_score'],NaN));if(!Number.isFinite(s))s=Math.round(t*.25+f*.25+v*.2+a*.1+(r==='Düşük'?10:r==='Yüksek'?4:7));return{code:get(o,['kod','code','symbol','ticker'],''),company:get(o,['şirket','sirket','company','name','title'],''),price:Number(get(o,['fiyat','price','close','last','lastPrice'],NaN)),technical:t,fundamental:f,valuation:v,flow:a,risk:r,score:s,sig:get(o,['sinyal','signal'],sig(s))}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let q=($('q').value||'').toLocaleLowerCase('tr-TR'),s=$('sig').value,so=$('sort').value;let R=A.filter(x=>(!q||x.code.toLocaleLowerCase('tr-TR').includes(q)||x.company.toLocaleLowerCase('tr-TR').includes(q))&&(!s||x.sig===s));R.sort((a,b)=>so==='code'?a.code.localeCompare(b.code,'tr'):so==='price'?b.price-a.price:so==='technical'?b.technical-a.technical:so==='flow'?b.flow-a.flow:b.score-a.score);$('total').textContent=A.length;$('strong').textContent=A.filter(x=>x.sig==='GÜÇLÜ').length;$('watch').textContent=A.filter(x=>x.sig==='İZLE').length;$('avg').textContent=A.length?Math.round(A.reduce((z,x)=>z+x.score,0)/A.length):'-';$('shown').textContent=R.length;$('rows').innerHTML=R.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.company)}</td><td class="num">${Number.isFinite(x.price)?x.price.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}):'-'}</td><td class="num">${x.technical}</td><td class="num">${x.fundamental}</td><td class="num">${x.valuation}</td><td class="num">${x.flow}</td><td>${esc(x.risk)}</td><td class="num"><b>${x.score}</b></td><td><span class="badge ${x.sig==='GÜÇLÜ'?'strong':x.sig==='İZLE'?'watch':x.sig==='ZAYIF'?'weak':'neutral'}">${esc(x.sig)}</span></td></tr>`).join('')||'<tr><td colspan="10" class="empty">Sonuç bulunamadı.</td></tr>'}async function load(){let data=null;for(const u of ['data.json','./data.json','data/data.json','./data/data.json'])try{let r=await fetch(u+'?v='+Date.now());if(r.ok){data=await r.json();break}}catch(e){}if(!data){$('rows').innerHTML='<tr><td colspan="10" class="empty">data.json bulunamadı.</td></tr>';return}if(Array.isArray(data))A=data;else if(Array.isArray(data.data))A=data.data;else if(Array.isArray(data.stocks))A=data.stocks;else if(Array.isArray(data.hisseler))A=data.hisseler;else{for(const k of Object.keys(data))if(Array.isArray(data[k])){A=data[k];break}}A=A.map(norm).filter(x=>x.code);render()}['q','sig','sort'].forEach(x=>$(x).addEventListener('input',render));load();</script></body></html>
