<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BIST Radar</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1220;
  color:#e5e7eb;
}

header{
  background:#111827;
  padding:18px 14px;
  position:sticky;
  top:0;
  z-index:20;
  border-bottom:1px solid #263244;
}

h1{
  margin:0 0 5px;
  font-size:25px;
}

.subtitle{
  color:#94a3b8;
  font-size:13px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:15px;
}

.status{
  margin-bottom:15px;
  padding:12px;
  border-radius:10px;
  background:#111827;
  border:1px solid #263244;
  color:#94a3b8;
}

.controls{
  display:grid;
  grid-template-columns:1fr 180px 180px;
  gap:10px;
  margin-bottom:15px;
}

input,select{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #334155;
  background:#0f172a;
  color:#fff;
  outline:none;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:15px;
}

.card{
  background:#111827;
  border:1px solid #263244;
  border-radius:10px;
  padding:14px;
}

.card-title{
  color:#94a3b8;
  font-size:12px;
}

.card-value{
  margin-top:5px;
  font-size:23px;
  font-weight:bold;
}

.table-wrap{
  overflow-x:auto;
  background:#111827;
  border:1px solid #263244;
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
}

th{
  text-align:left;
  padding:12px 8px;
  background:#172033;
  color:#94a3b8;
  font-size:12px;
  position:sticky;
  top:0;
}

td{
  padding:11px 8px;
  border-top:1px solid #202b3d;
  font-size:13px;
}

tr:hover{
  background:#172033;
  cursor:pointer;
}

.code{
  font-weight:bold;
  color:#60a5fa;
}

.score{
  font-size:17px;
  font-weight:bold;
}

.signal{
  display:inline-block;
  padding:5px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:bold;
}

.strong{
  background:#14532d;
  color:#86efac;
}

.positive{
  background:#064e3b;
  color:#6ee7b7;
}

.neutral{
  background:#713f12;
  color:#fde68a;
}

.weak{
  background:#7f1d1d;
  color:#fca5a5;
}

.sell{
  background:#450a0a;
  color:#fecaca;
}

.muted{
  color:#94a3b8;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:50;
  padding:20px;
}

.modal-box{
  max-width:700px;
  margin:40px auto;
  background:#111827;
  border:1px solid #334155;
  border-radius:14px;
  padding:20px;
  max-height:85vh;
  overflow:auto;
}

.modal-close{
  float:right;
  border:0;
  background:#334155;
  color:white;
  border-radius:7px;
  padding:7px 11px;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}

.detail{
  background:#0f172a;
  padding:12px;
  border-radius:8px;
}

.detail small{
  color:#94a3b8;
  display:block;
  margin-bottom:4px;
}

.loading{
  text-align:center;
  padding:40px;
  color:#94a3b8;
}

.error{
  background:#450a0a;
  color:#fecaca;
  padding:15px;
  border-radius:10px;
}

@media(max-width:800px){
  .controls{
    grid-template-columns:1fr;
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>📡 BIST Radar</h1>
  <div class="subtitle">
    Günlük hisse tarama ve skor sistemi
  </div>
</header>

<div class="container">

  <div id="status" class="status">
    Veriler yükleniyor...
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-title">Toplam Hisse</div>
      <div id="totalStocks" class="card-value">-</div>
    </div>

    <div class="card">
      <div class="card-title">Güçlü Sinyal</div>
      <div id="strongStocks" class="card-value">-</div>
    </div>

    <div class="card">
      <div class="card-title">Pozitif</div>
      <div id="positiveStocks" class="card-value">-</div>
    </div>

    <div class="card">
      <div class="card-title">Ortalama Skor</div>
      <div id="averageScore" class="card-value">-</div>
    </div>
  </div>

  <div class="controls">

    <input
      id="search"
      type="search"
      placeholder="Hisse ara: ASELS, THYAO..."
    >

    <select id="signalFilter">
      <option value="">Tüm sinyaller</option>
      <option value="strong">Güçlü</option>
      <option value="positive">Pozitif</option>
      <option value="neutral">Nötr</option>
      <option value="weak">Zayıf</option>
      <option value="sell">Sat</option>
    </select>

    <select id="sortSelect">
      <option value="score">Skora göre</option>
      <option value="technical">Teknik</option>
      <option value="momentum">Momentum</option>
      <option value="flow">Para Akışı</option>
      <option value="risk">Risk</option>
      <option value="ret21">21 Gün</option>
      <option value="rsi">RSI</option>
    </select>

  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Hisse</th>
          <th>Fiyat</th>
          <th>Skor</th>
          <th>Sinyal</th>
          <th>Teknik</th>
          <th>Momentum</th>
          <th>Para Akışı</th>
          <th>Risk</th>
          <th>RSI</th>
          <th>21 Gün</th>
        </tr>
      </thead>

      <tbody id="stockTableBody">
        <tr>
          <td colspan="11" class="loading">
            Veriler yükleniyor...
          </td>
        </tr>
      </tbody>

    </table>

  </div>

</div>

<div id="stockModal" class="modal">

  <div class="modal-box">

    <button class="modal-close" onclick="closeModal()">
      Kapat
    </button>

    <h2 id="modalTitle">Hisse</h2>

    <div id="modalContent"></div>

  </div>

</div>

<script>

const DATA_URL = "./data.json";

let stocks = [];
let filteredStocks = [];


/* --------------------------------------------------
   GÜVENLİ SAYI
-------------------------------------------------- */

function num(value, fallback=0){

  const n = Number(value);

  return Number.isFinite(n) ? n : fallback;

}


/* --------------------------------------------------
   YÜZDE FORMAT
-------------------------------------------------- */

function percent(value){

  const n = num(value);

  return (n >= 0 ? "+" : "") + n.toFixed(2) + "%";

}


/* --------------------------------------------------
   SKOR MOTORU V2
-------------------------------------------------- */

function calculateStock(stock){

  const technical =
    num(stock.technical,50);

  const flow =
    num(stock.flow,50);

  const risk =
    num(stock.riskScore,50);

  const fundamental =
    num(stock.fundamental,50);

  const valuation =
    num(stock.valuation,50);

  const rsi =
    num(stock.rsi,50);

  const ret21 =
    num(stock.ret21,0);

  /*
    Momentum:

    21 günlük performans + RSI
    üzerinden normalize edilir.
  */

  let momentum = 50;

  if(ret21 > 15) momentum += 25;
  else if(ret21 > 8) momentum += 18;
  else if(ret21 > 3) momentum += 10;
  else if(ret21 > 0) momentum += 5;
  else if(ret21 < -15) momentum -= 25;
  else if(ret21 < -8) momentum -= 18;
  else if(ret21 < -3) momentum -= 10;
  else if(ret21 < 0) momentum -= 5;


  if(rsi >= 50 && rsi <= 70)
    momentum += 10;

  else if(rsi > 75)
    momentum -= 8;

  else if(rsi < 35)
    momentum -= 8;


  momentum =
    Math.max(0,Math.min(100,momentum));


  /*
    Yeni toplam skor

    Teknik       %30
    Momentum     %20
    Para akışı   %15
    Temel        %10
    Değerleme    %10
    Risk         %15
  */

  const score = Math.round(

    technical * .30 +
    momentum * .20 +
    flow * .15 +
    fundamental * .10 +
    valuation * .10 +
    risk * .15

  );


  let signal;

  if(score >= 75)
    signal = "strong";

  else if(score >= 65)
    signal = "positive";

  else if(score >= 55)
    signal = "neutral";

  else if(score >= 45)
    signal = "weak";

  else
    signal = "sell";


  return {

    ...stock,

    technical,
    momentum,
    flow,
    risk,
    fundamental,
    valuation,
    rsi,
    ret21,
    score,
    signal

  };

}


/* --------------------------------------------------
   SİNYAL ADI
-------------------------------------------------- */

function signalName(signal){

  const names = {

    strong:"GÜÇLÜ",

    positive:"POZİTİF",

    neutral:"NÖTR",

    weak:"ZAYIF",

    sell:"SAT"

  };

  return names[signal] || "NÖTR";

}


/* --------------------------------------------------
   TABLO
-------------------------------------------------- */

function render(){

  const search =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const signal =
    document.getElementById("signalFilter").value;

  const sort =
    document.getElementById("sortSelect").value;


  filteredStocks = stocks.filter(stock => {

    const matchesSearch =

      !search ||

      String(stock.code || "")
        .toLowerCase()
        .includes(search) ||

      String(stock.name || "")
        .toLowerCase()
        .includes(search);


    const matchesSignal =

      !signal ||

      stock.signal === signal;


    return matchesSearch && matchesSignal;

  });


  filteredStocks.sort((a,b)=>{

    const values = {

      score:b.score-a.score,

      technical:b.technical-a.technical,

      momentum:b.momentum-a.momentum,

      flow:b.flow-a.flow,

      risk:b.risk-a.risk,

      ret21:b.ret21-a.ret21,

      rsi:b.rsi-a.rsi

    };

    return values[sort] ?? 0;

  });


  const body =
    document.getElementById("stockTableBody");


  if(!filteredStocks.length){

    body.innerHTML = `

      <tr>

        <td colspan="11" class="loading">

          Hisse bulunamadı.

        </td>

      </tr>

    `;

    return;

  }


  body.innerHTML = filteredStocks
    .map((stock,index)=>`

      <tr onclick="showStockDetails(${index})">

        <td>${index+1}</td>

        <td>

          <span class="code">

            ${escapeHTML(stock.code)}

          </span>

          <br>

          <span class="muted">

            ${escapeHTML(stock.name || "")}

          </span>

        </td>

        <td>

          ${num(stock.price).toFixed(2)}

        </td>

        <td>

          <span class="score">

            ${stock.score}

          </span>

        </td>

        <td>

          <span class="signal ${stock.signal}">

            ${signalName(stock.signal)}

          </span>

        </td>

        <td>${Math.round(stock.technical)}</td>

        <td>${Math.round(stock.momentum)}</td>

        <td>${Math.round(stock.flow)}</td>

        <td>${Math.round(stock.risk)}</td>

        <td>${num(stock.rsi).toFixed(1)}</td>

        <td>${percent(stock.ret21)}</td>

      </tr>

    `)
    .join("");

}


/* --------------------------------------------------
   İSTATİSTİKLER
-------------------------------------------------- */

function updateSummary(){

  const total = stocks.length;

  const strong =
    stocks.filter(x=>x.signal==="strong").length;

  const positive =
    stocks.filter(x=>x.signal==="positive").length;

  const average =
    total

      ? stocks.reduce((sum,x)=>sum+x.score,0)/total

      : 0;


  document.getElementById("totalStocks")
    .textContent = total;

  document.getElementById("strongStocks")
    .textContent = strong;

  document.getElementById("positiveStocks")
    .textContent = positive;

  document.getElementById("averageScore")
    .textContent = average.toFixed(1);


  document.getElementById("status")
    .textContent =

      `BIST Radar aktif • ${total} hisse tarandı • ` +
      `${strong} güçlü sinyal • ` +
      `${positive} pozitif sinyal`;

}


/* --------------------------------------------------
   VERİYİ YÜKLE
-------------------------------------------------- */

async function loadData(){

  try{

    const response =
      await fetch(DATA_URL + "?v=" + Date.now());


    if(!response.ok){

      throw new Error(
        "data.json yüklenemedi. HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(!Array.isArray(data)){

      throw new Error(
        "data.json liste formatında değil."
      );

    }


    stocks =
      data
        .map(calculateStock)
        .filter(x=>x.code);


    stocks.sort(
      (a,b)=>b.score-a.score
    );


    updateSummary();

    render();


  }catch(error){

    console.error(error);

    document.getElementById("status")
      .innerHTML = `

        <div class="error">

          <strong>Veri yüklenemedi.</strong><br><br>

          ${escapeHTML(error.message)}

          <br><br>

          Kontrol edilmesi gereken dosya:
          <strong>data.json</strong>

        </div>

      `;

  }

}


/* --------------------------------------------------
   DETAY
-------------------------------------------------- */

function showStockDetails(index){

  const stock =
    filteredStocks[index];

  if(!stock) return;


  document.getElementById("modalTitle")
    .textContent =

      `${stock.code} • ${stock.name || ""}`;


  document.getElementById("modalContent")
    .innerHTML = `

      <span class="signal ${stock.signal}">

        ${signalName(stock.signal)}

      </span>


      <div class="detail-grid">

        ${detail("Toplam Skor",stock.score)}

        ${detail("Fiyat",num(stock.price).toFixed(2))}

        ${detail("Teknik",Math.round(stock.technical))}

        ${detail("Momentum",Math.round(stock.momentum))}

        ${detail("Para Akışı",Math.round(stock.flow))}

        ${detail("Risk Skoru",Math.round(stock.risk))}

        ${detail("RSI",num(stock.rsi).toFixed(2))}

        ${detail("21 Gün",percent(stock.ret21))}

        ${detail("Hacim Oranı",num(stock.volumeRatio).toFixed(2))}

        ${detail("Volatilite",num(stock.volatility).toFixed(2))}

        ${detail("Temel",Math.round(stock.fundamental))}

        ${detail("Değerleme",Math.round(stock.valuation))}

      </div>

    `;


  document.getElementById("stockModal")
    .style.display = "block";

}


function detail(title,value){

  return `

    <div class="detail">

      <small>${title}</small>

      <strong>${value}</strong>

    </div>

  `;

}


function closeModal(){

  document.getElementById("stockModal")
    .style.display = "none";

}


/* --------------------------------------------------
   GÜVENLİ HTML
-------------------------------------------------- */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* --------------------------------------------------
   EVENTLER
-------------------------------------------------- */

document
  .getElementById("search")
  .addEventListener("input",render);


document
  .getElementById("signalFilter")
  .addEventListener("change",render);


document
  .getElementById("sortSelect")
  .addEventListener("change",render);


document
  .getElementById("stockModal")
  .addEventListener("click",function(event){

    if(event.target === this){

      closeModal();

    }

  });


/* --------------------------------------------------
   BAŞLAT
-------------------------------------------------- */

loadData();

</script>

</body>
</html>
